<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADF Ranks Quiz | Helix</title>
  <meta name="description" content="Quiz on Australian Defence Force rank insignia for the Navy, Army and Air Force.">

  <link rel="icon" type="image/png" href="/assets/shell-outline-black-bg.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div data-site-navbar></div>

  <main class="container my-4">
    <div class="quiz-layout">
      <section class="settings-section">
        <fieldset>
          <legend>Question Type</legend>
          <label>
            <input type="radio" name="quiz-mode" value="insignia-to-name" checked />
            Insignia → rank
          </label>
          <label>
            <input type="radio" name="quiz-mode" value="name-to-insignia" />
            Rank → insignia
          </label>
          <label>
            <input type="radio" name="quiz-mode" value="mixed" />
            Mixed
          </label>
        </fieldset>

        <fieldset>
          <legend>Services</legend>
          <label><input type="checkbox" name="service" value="navy" checked /> Navy</label>
          <label><input type="checkbox" name="service" value="army" checked /> Army</label>
          <label><input type="checkbox" name="service" value="raaf" checked /> Air Force</label>
        </fieldset>

        <fieldset>
          <legend>Ranks</legend>
          <label><input type="checkbox" name="group" value="officer" checked /> Officers</label>
          <label><input type="checkbox" name="group" value="enlisted" checked /> Enlisted &amp; warrant officers</label>
          <label><input type="checkbox" name="group" value="appointment" checked /> Special appointments</label>
          <p id="pool-count" class="pool-count"></p>
        </fieldset>
      </section>

      <section class="quiz-column">
        <div class="quiz-card">
          <div class="score-bar">
            <span>Score <strong id="score">0 / 0</strong></span>
            <span>Streak <strong id="streak">0</strong></span>
            <button id="reset-button" class="btn btn-sm btn-outline-primary">Reset</button>
          </div>

          <p id="question-text" class="question-text"></p>
          <div id="prompt" class="prompt"></div>
          <div id="options" class="options"></div>

          <p id="feedback" class="feedback" role="status"></p>

          <button id="next-button" class="btn btn-primary next-button" hidden>Next question</button>
        </div>

        <p class="shortcut-hint">
          Shortcuts: <kbd>1</kbd>–<kbd>4</kbd> answer &middot; <kbd>Space</kbd> next
        </p>
      </section>
    </div>

    <details class="study-sheet">
      <summary>Study sheet <span class="study-note">(ranks selected above)</span></summary>
      <div id="study-grid" class="study-grid"></div>
    </details>

    <p class="insignia-note">
      Insignia are simplified drawings for practice, not official artwork.
    </p>
  </main>

  <div data-site-footer></div>

  <script src="../components.js"></script>
  <script src="insignia.js"></script>
  <script src="ranks.js"></script>
  <script src="app.js"></script>
</body>
</html>
