<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morse Drop | Helix</title>
  <meta name="description" content="Flashing-light Morse code trainer.">

  <link rel="icon" type="image/png" href="/assets/shell-outline-black-bg.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div data-site-navbar></div>

  <main class="container my-4">
    <div class="trainer-layout">
      <section class="settings-section">
        <fieldset>
          <legend>Timing</legend>

          <label>
            Words per minute
            <input type="range" id="wpm" min="1" max="8" step="1" value="4" />
            <span id="wpm-display" class="value-display">4</span>
          </label>

        </fieldset>

        <fieldset>
          <legend>Message Structure</legend>

          <label>
            <input type="checkbox" id="enable-preroll" />
            Start with "All Ships" x3
          </label>

          <label>
            Characters per word
            <input type="range" id="word-length" min="1" max="10" value="5" />
            <span id="word-length-display" class="value-display">5</span>
          </label>

          <label>
            Number of words
            <input type="range" id="word-count" min="1" max="20" value="1" />
            <span id="word-count-display" class="value-display">1</span>
          </label>

          <label>
            <input type="checkbox" id="enable-ii-between-words" />
            Insert II between words
          </label>

          <label>
            <input type="checkbox" id="enable-auto-repeat" />
            Auto-repeat after reveal
          </label>
        </fieldset>

        <fieldset class="character-sets">
          <legend>Character Sets</legend>

          <div data-options-grid="2col">
            <label>
              <input type="checkbox" id="enable-letters-am" data-group="lettersAM" checked />
              Letters A–M
            </label>

            <label>
              <input type="checkbox" id="enable-letters-nz" data-group="lettersNZ" checked />
              Letters N–Z
            </label>

            <label>
              <input type="checkbox" id="enable-numbers" data-group="numbers" />
              Numbers (0–9)
            </label>

            <label>
              <input type="checkbox" id="enable-prosigns" data-group="prosigns" />
              Prosigns
            </label>
          </div>

          <details class="char-picker">
            <summary>
              Individual characters
              <span id="char-count" class="char-count"></span>
            </summary>
            <div id="char-picker-groups"></div>
          </details>

          <p id="no-chars-warning" class="no-chars-warning" hidden>
            Enable at least one character to start.
          </p>
        </fieldset>

        <fieldset data-auto-reveal-group>
          <legend>Auto Reveal</legend>

          <label>
            <input type="radio" name="auto-reveal" value="disabled" />
            Disabled
          </label>

          <label>
            <input type="radio" name="auto-reveal" value="immediate" />
            Immediate
          </label>

          <label>
            <input type="radio" name="auto-reveal" value="3s" checked />
            3 seconds
          </label>
        </fieldset>
      </section>

      <div class="signal-column">
        <section class="signal-section">
          <div id="signal-light" aria-hidden="true"></div>
          <p id="status-text" role="status">Not Transmitting</p>
          <div id="message-output" class="message-output" hidden></div>
        </section>

        <div class="controls-section">
          <button id="start-button" class="btn btn-primary">Start Transmission</button>
          <button id="stop-button" class="btn btn-outline-primary" disabled>Stop Transmission</button>
          <button id="reveal-button" class="btn btn-primary" disabled>Reveal Message</button>
        </div>

        <p class="shortcut-hint">
          Shortcuts: <kbd>Space</kbd> start / reveal &middot; <kbd>Esc</kbd> stop
        </p>
      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="../components.js"></script>
  <script src="app.js"></script>
</body>
</html>
